name: Build Feather Wildcard IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode (prefer 26.2)
        shell: bash
        run: |
          set -e
          if [ -d /Applications/Xcode_26.2.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          elif [ -d /Applications/Xcode_26.2.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.0.app/Contents/Developer
          else
            echo 'Xcode 26.2 not installed on this runner; using default Xcode.'
          fi
          xcodebuild -version
          xcode-select -p

      - name: Clean build state
        shell: bash
        run: |
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData/Feather"*
          rm -rf .build

      - name: Build unsigned IPA
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/
        run: |
          set -o pipefail
          make iphoneos 2>&1 | tee "$RUNNER_TEMP/feather-build.log"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Feather-Wildcard-IPA
          path: packages/Feather.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Feather-Build-Log
          path: ${{ runner.temp }}/feather-build.log
          if-no-files-found: ignore
