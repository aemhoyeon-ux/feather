name: Build Feather Wildcard IPA (Xcode 16)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.4 to avoid Xcode 26 SwiftPM crash
        shell: bash
        run: |
          set -euo pipefail
          echo 'Installed Xcode versions:'
          ls -d /Applications/Xcode*.app || true
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.4.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.0.app/Contents/Developer
          else
            echo 'ERROR: Xcode 16.4 unavailable. Refusing to silently fall back to Xcode 26.'
            exit 1
          fi
          xcodebuild -version

      - name: Verify local Swift packages and submodules
        shell: bash
        run: |
          set -euo pipefail
          git submodule status
          for file in Zsign/Package.swift IDeviceKitten/Package.swift NimbleKit/Package.swift AltSourceKit/Package.swift; do
            test -f "$file" || { echo "Missing package manifest: $file"; exit 1; }
          done
          test -f Feather.xcodeproj/project.pbxproj

      - name: Clean SwiftPM caches
        shell: bash
        run: |
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData/Feather"* .build _build

      - name: Build unsigned IPA
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}/
        run: |
          set -o pipefail
          make iphoneos 2>&1 | tee "$RUNNER_TEMP/feather-build.log"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Feather-Wildcard-IPA
          path: packages/Feather.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Feather-Build-Log
          path: ${{ runner.temp }}/feather-build.log
          if-no-files-found: ignore
