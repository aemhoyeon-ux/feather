name: Build Feather Wildcard IPA (direct Xcode)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Inspect build environment
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          ls -d /Applications/Xcode*.app || true
          git submodule status
          test -f Feather.xcodeproj/project.pbxproj
      - name: Build unsigned Feather app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feather-derived"
          xcodebuild \
            -project Feather.xcodeproj \
            -scheme Feather \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/feather-derived" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO \
            build 2>&1 | tee "$RUNNER_TEMP/feather-build.log"
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/feather-derived/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP" || { echo 'No .app produced'; exit 1; }
          mkdir -p package/Payload
          ditto "$APP" "package/Payload/Feather.app"
          mkdir -p packages
          (cd package && zip -qry ../packages/Feather-unsigned.ipa Payload)
          unzip -t packages/Feather-unsigned.ipa | tail -1
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather-unsigned-IPA
          path: packages/Feather-unsigned.ipa
          if-no-files-found: error
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Feather-Build-Log
          path: ${{ runner.temp }}/feather-build.log
          if-no-files-found: ignore
